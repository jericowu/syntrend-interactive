<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>三創互動樓層導覽</title><link rel="stylesheet" href="interactive.css"></head><body>
<header><div class="head"><div><span class="eyebrow">SYNTREND · INTERACTIVE FLOOR GUIDE</span><h1>三創互動樓層導覽</h1><p>點擊平面圖上的專櫃，即可查詢販售品牌與副牌資訊</p></div><span class="tag">獨立測試版</span></div></header>
<main><div class="toolbar"><div class="floorbar" id="floors" aria-label="選擇樓層"></div><div class="searchrow"><label for="search">快速搜尋</label><input id="search" type="search" placeholder="品牌、專櫃、櫃號或商品關鍵字…" autocomplete="off"><button id="reset">清除</button></div></div>
<div class="layout"><section class="mapcard"><div class="sectiontop"><div><h2 id="floorTitle">1F 互動平面圖</h2><p>點擊灰色專櫃區塊；可放大查看細節</p></div><div class="zoom"><button id="minus" aria-label="縮小">−</button><span id="zoomLabel">100%</span><button id="plus" aria-label="放大">＋</button><button id="fit">重設</button></div></div><div class="viewport" id="viewport"><div class="maplayer" id="maplayer"><img id="mapImage" src="maps/1f plan.png" alt="三創樓層平面圖"><svg id="overlay" viewBox="0 0 1721 864" preserveAspectRatio="none" aria-label="可點擊專櫃區塊"></svg></div></div><div class="mapfoot"><span><i class="legend"></i> 滑鼠移入／觸控可點選的櫃位</span><span id="coverage"></span></div></section>
<aside class="detail"><div class="sectiontop"><div><h2>專櫃資訊</h2><p>選擇地圖區塊查看詳細資料</p></div></div><div id="detailBody" class="detailbody"><div class="empty"><div class="emptyicon">⌖</div>請點擊地圖上的專櫃區塊</div></div></aside></div>
<section class="directory"><div class="sectiontop"><div><h2 id="directoryTitle">本樓層專櫃</h2><p>也可以直接從清單開啟專櫃資訊</p></div><span id="resultCount"></span></div><div id="directory" class="tiles"></div></section><footer>資料來源：使用者提供的樓層平面圖、專櫃副牌表及既有查詢系統。副牌資訊依 Excel 專櫃名稱關聯，可能存在名稱差異；未列出不代表沒有販售。櫃位與商品以現場為準。此為個人工作輔助工具，非官方網站。</footer></main>
<script src="data.js"></script><script src="zones.js"></script><script src="interactive.js"></script></body></html>
